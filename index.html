<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Aave Monitor</title>
<style>
  :root{--bg:#111;--card:#1c1c1c;--text:#f2f2f2;--mut:#8a8a8a;--ok:#3ecf8e;--warn:#f5b942;--bad:#ff5c5c;--blue:#4c9aff;--pill:#3b8df0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.3 system-ui,sans-serif;padding:16px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
  h1{font-size:18px;margin:0}
  button{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600}
  button:disabled{opacity:.5}
  .meta{color:var(--mut);font-size:13px;margin-bottom:12px}
  .row{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-left:4px solid var(--ok)}
  .row.warn{border-left-color:var(--warn)} .row.bad{border-left-color:var(--bad)} .row.na{border-left-color:#555}
  a.asset{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;min-width:0;flex:1}
  .ico{position:relative;width:44px;height:44px;flex:none}
  .tok,.ico>.fb{width:44px;height:44px;border-radius:50%;display:block}
  .chain{position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:50%;background:var(--card);border:2px solid var(--card);overflow:hidden;display:flex}
  .chain img,.chain .fb{width:100%;height:100%;border-radius:50%;display:flex}
  .fb{align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
  .chain .fb{font-size:7px}
  .txt{min-width:0}
  .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sym{font-weight:700;font-size:18px}
  .pill{background:var(--pill);color:#fff;font-weight:700;font-size:13px;border-radius:999px;padding:2px 10px;white-space:nowrap}
  .sub{color:var(--mut);font-size:13px;margin-top:3px}
  .right{text-align:right;flex:none}
  .util{font-size:14px;font-weight:600}
  .avail{color:var(--mut);font-size:12px;margin-top:3px}
  .err{color:var(--bad);font-size:14px;margin:8px 0;white-space:pre-wrap}
  .sum{margin-top:12px;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>Aave: APY и утилизация</h1>
  <button id="btn">Обновить</button>
</header>
<div class="meta" id="meta">Загрузка…</div>
<div id="list"></div>
<div class="err" id="err"></div>
<div class="sum" id="sum"></div>

<script>
// ===== НАСТРОЙКИ =====
// share = ваша доля позиции в % (нужна только для средневзвешенного APY, в строках не показывается)
const POSITIONS = [
  // track = окончание ссылки на aavetracker.com/markets/<сеть>/<track>/
  {chainId:43114, symbol:'USDC', track:'usdc',       share:41.39},
  {chainId:10,    symbol:'USDC', track:'usdc-0b2c',  share:11.92},
  {chainId:1,     symbol:'USDC', track:'usdc',       share:11.92},
  {chainId:1,     symbol:'USDG', track:'usdg',       share:10.67},
  {chainId:137,   symbol:'USDT', track:'usdt0', alt:['USDT0','USD₮0'], share:11.93},
  {chainId:43114, symbol:'USDT', track:'usdt',       share:11.94},
];
const CHAINS = {
  1:     {name:'Ethereum',  slug:'ethereum',  market:'proto_mainnet_v3',   bg:'#627eea', lb:'ETH'},
  43114: {name:'Avalanche', slug:'avalanche', market:'proto_avalanche_v3', bg:'#e84142', lb:'AVAX'},
  10:    {name:'Optimism',  slug:'optimism',  market:'proto_optimism_v3',  bg:'#ff0420', lb:'OP'},
  137:   {name:'Polygon',   slug:'polygon',   market:'proto_polygon_v3',   bg:'#8247e5', lb:'POL'},
  42161: {name:'Arbitrum',  slug:'arbitrum',  market:'proto_arbitrum_v3',  bg:'#28a0f0', lb:'ARB'},
};
const TOKEN_BG = {USDC:'#2775ca', USDT:'#26a17b', USDG:'#9fd356'};
const UTIL_WARN = 80;   // жёлтый от этого значения, %
const UTIL_BAD  = 90;   // красный от этого значения, %
const APY_ALERT = {'43114 USDC': 4.0}; // жёлтый, если APY ниже порога (сеть + токен)
const REFRESH_MS = 60*60*1000; // раз в час
const API = 'https://api.v3.aave.com/graphql';
const APP = 'https://app.aave.com';
// =====================

const $ = id => document.getElementById(id);
const KEY = 'aave-monitor-cache-v3';

// Варианты запроса: от полного к минимальному (если какое-то поле не поддерживается)
const VARIANTS = [
  `supplyInfo{apy{formatted} total{value}} borrowInfo{apy{formatted} total{amount{value}} utilizationRate{formatted} availableLiquidity{amount{value} usd}}`,
  `supplyInfo{apy{formatted}} borrowInfo{utilizationRate{formatted} availableLiquidity{amount{value} usd}}`,
  `supplyInfo{apy{formatted} total{value}} borrowInfo{total{amount{value}} availableLiquidity{amount{value} usd}}`,
  `supplyInfo{apy{formatted}} borrowInfo{availableLiquidity{amount{value} usd}}`,
];
// Дополнительные данные: адреса токенов (для ссылок) и иконки. Если поля нет, страница работает без них.
const META_VARIANTS = [
  {chainIcon:true,  fields:'underlyingToken{symbol address imageUrl}'},
  {chainIcon:false, fields:'underlyingToken{symbol address imageUrl}'},
  {chainIcon:false, fields:'underlyingToken{symbol address}'},
];

const num = x => { const n = parseFloat(String(x).replace(/[^0-9.\-]/g,'')); return isNaN(n)?null:n; };
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function fmt(n, d=2){ return (n==null||isNaN(n)) ? '—' : Number(n).toFixed(d); }
function money(n){
  if(n==null||isNaN(n)) return '—';
  if(n>=1e9) return '$'+(n/1e9).toFixed(2)+'B';
  if(n>=1e6) return '$'+(n/1e6).toFixed(1)+'M';
  return '$'+Math.round(n/1e3)+'K';
}

async function gql(query){
  const res = await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query})});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const j = await res.json();
  if(j.errors && j.errors.length) throw new Error(j.errors[0].message);
  return j.data;
}

async function fetchChain(chainId){
  let lastErr;
  for(const v of VARIANTS){
    try{
      const q = `{ markets(request:{chainIds:[${chainId}]}) { reserves { underlyingToken{symbol} ${v} isFrozen isPaused } } }`;
      const d = await gql(q);
      return d.markets.flatMap(m=>m.reserves);
    }catch(e){ lastErr = e; }
  }
  throw lastErr;
}

async function fetchMeta(chainId){
  for(const v of META_VARIANTS){
    try{
      const q = `{ markets(request:{chainIds:[${chainId}]}) { ${v.chainIcon?'chain{icon} ':''}reserves { ${v.fields} } } }`;
      const d = await gql(q);
      const tokens = {};
      let chainIcon = null;
      for(const m of d.markets){
        if(m.chain && m.chain.icon && !chainIcon) chainIcon = m.chain.icon;
        for(const r of m.reserves){
          const t = r.underlyingToken;
          if(t && t.symbol && !tokens[t.symbol.toUpperCase()]) tokens[t.symbol.toUpperCase()] = t;
        }
      }
      return {chainIcon, tokens};
    }catch(e){ /* пробуем более простой вариант */ }
  }
  return {chainIcon:null, tokens:{}};
}

function parseReserve(r){
  const s = r.supplyInfo||{}, b = r.borrowInfo||{};
  const apy = num(s.apy && s.apy.formatted);
  const supplied = num(s.total && s.total.value);
  const borrowed = num(b.total && b.total.amount && b.total.amount.value);
  const availUsd = num(b.availableLiquidity && b.availableLiquidity.usd);
  let util = null;
  if(b.utilizationRate && b.utilizationRate.formatted!=null){
    util = num(b.utilizationRate.formatted);
    if(util!=null && util<=1 && String(b.utilizationRate.formatted).indexOf('%')<0) util*=100;
  } else if(supplied && borrowed!=null){
    util = 100*borrowed/supplied;
  }
  return {apy, util, availUsd, supplied, sym:(r.underlyingToken&&r.underlyingToken.symbol)||''};
}

async function loadAll(){
  const chains = [...new Set(POSITIONS.map(p=>p.chainId))];
  const data = {}, meta = {};
  await Promise.all(chains.map(async id=>{
    const [d, m] = await Promise.all([fetchChain(id), fetchMeta(id)]);
    data[id] = d; meta[id] = m;
  }));
  return POSITIONS.map(pos=>{
    const names = [pos.symbol, ...(pos.alt||[])].map(s=>s.toUpperCase());
    const cands = (data[pos.chainId]||[]).filter(r=>r.underlyingToken && names.includes(r.underlyingToken.symbol.toUpperCase()) && !r.isFrozen && !r.isPaused).map(parseReserve);
    cands.sort((a,b)=>((b.supplied||b.availUsd||0)-(a.supplied||a.availUsd||0)));
    const c = cands[0];
    const m = meta[pos.chainId]||{tokens:{}};
    const sym = c ? c.sym : pos.symbol;
    const t = m.tokens[sym.toUpperCase()] || m.tokens[pos.symbol.toUpperCase()] || {};
    const extra = {address:t.address||null, imageUrl:t.imageUrl||null, chainIcon:m.chainIcon||null, shown:sym};
    if(c) return {...pos, found:true, ...c, ...extra};
    const syms = [...new Set((data[pos.chainId]||[]).map(r=>r.underlyingToken&&r.underlyingToken.symbol).filter(s=>s&&/USD|₮|DAI|EUR/i.test(s)))].join(', ');
    return {...pos, found:false, syms, ...extra};
  });
}

function link(r){
  const ch = CHAINS[r.chainId];
  return `https://aavetracker.com/markets/${ch.slug}/${r.track}/`;
}
function tokenSrcs(r){
  const a = (r.shown||r.symbol).toLowerCase().replace(/[^a-z0-9]/g,'');
  const b = r.symbol.toLowerCase();
  return [r.imageUrl, `${APP}/icons/tokens/${a}.svg`, `${APP}/icons/tokens/${b}.svg`].filter((x,i,arr)=>x && arr.indexOf(x)===i);
}
function chainSrcs(r){
  const ch = CHAINS[r.chainId];
  return [r.chainIcon && /^https?:/.test(r.chainIcon) ? r.chainIcon : null, `${APP}/icons/networks/${ch.slug}.svg`].filter(Boolean);
}
function imgTag(cls, srcs, fbText, fbBg){
  return `<img class="${cls}" alt="" referrerpolicy="no-referrer" src="${esc(srcs[0])}" data-srcs="${esc(JSON.stringify(srcs))}" data-i="0" data-fb="${esc(fbText)}" data-bg="${esc(fbBg)}">`;
}
// если иконка не загрузилась: пробуем следующий адрес, затем цветной кружок с буквами
document.addEventListener('error', e=>{
  const el = e.target;
  if(!el || el.tagName!=='IMG' || !el.dataset.srcs) return;
  const list = JSON.parse(el.dataset.srcs);
  const i = +el.dataset.i + 1;
  if(i < list.length){ el.dataset.i = i; el.src = list[i]; return; }
  const fb = document.createElement('span');
  fb.className = 'fb'; fb.textContent = el.dataset.fb; fb.style.background = el.dataset.bg;
  el.replaceWith(fb);
}, true);

function render(rows, ts, stale){
  $('list').innerHTML = rows.map(r=>{
    const ch = CHAINS[r.chainId];
    const key = r.chainId+' '+r.symbol;
    const name = r.shown||r.symbol;
    const tokBg = TOKEN_BG[r.symbol]||'#555';
    const icon = `<span class="ico">${imgTag('tok', tokenSrcs(r), name[0], tokBg)}<span class="chain">${imgTag('', chainSrcs(r), ch.lb, ch.bg)}</span></span>`;
    if(!r.found){
      return `<div class="row na"><a class="asset" href="${esc(link(r))}" target="_blank" rel="noopener">${icon}<span class="txt"><span class="top"><span class="sym">${esc(name)}</span></span><span class="sub">${ch.name}: пул не найден. На сети есть: ${esc(r.syms||'—')}</span></span></a></div>`;
    }
    let cls='';
    if(r.util!=null){ if(r.util>=UTIL_BAD) cls='bad'; else if(r.util>=UTIL_WARN) cls='warn'; }
    if(APY_ALERT[key]!=null && r.apy!=null && r.apy<APY_ALERT[key]) cls = cls||'warn';
    return `<div class="row ${cls}">
      <a class="asset" href="${esc(link(r))}" target="_blank" rel="noopener">${icon}
        <span class="txt">
          <span class="top"><span class="sym">${esc(name)}</span><span class="pill">APY ${fmt(r.apy)}%</span></span>
          <span class="sub">${ch.name}</span>
        </span>
      </a>
      <div class="right"><div class="util">util ${fmt(r.util,1)}%</div><div class="avail">свободно ${money(r.availUsd)}</div></div>
    </div>`;
  }).join('');
  const f = rows.filter(r=>r.found && r.apy!=null);
  const w = f.reduce((s,r)=>s+r.share,0);
  const avg = w ? f.reduce((s,r)=>s+r.apy*r.share,0)/w : null;
  $('sum').textContent = avg!=null ? `Средневзвешенный APY: ${fmt(avg)}%` : '';
  $('meta').textContent = (stale?'Данные из кэша, ':'Обновлено ')+new Date(ts).toLocaleString('ru-RU');
}

async function load(){
  $('btn').disabled = true; $('err').textContent='';
  try{
    const rows = await loadAll();
    const ts = Date.now();
    try{ localStorage.setItem(KEY, JSON.stringify({ts, rows})); }catch(e){}
    render(rows, ts, false);
  }catch(e){
    $('err').textContent = 'Не удалось обновить: '+e.message;
    try{
      const c = JSON.parse(localStorage.getItem(KEY)||'null');
      if(c) render(c.rows, c.ts, true); else $('meta').textContent='Нет данных';
    }catch(_){}
  }finally{ $('btn').disabled = false; }
}

$('btn').onclick = load;
try{ const c=JSON.parse(localStorage.getItem(KEY)||'null'); if(c) render(c.rows,c.ts,true); }catch(e){}
load();
setInterval(load, REFRESH_MS);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    try{ const c=JSON.parse(localStorage.getItem(KEY)||'null');
      if(!c || Date.now()-c.ts>REFRESH_MS) load(); }catch(e){ load(); }
  }
});
</script>
</body>
</html>
